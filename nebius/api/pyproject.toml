[project]
name = "showtime-api"
version = "0.1.0"
description = "Showtime: Red Team Night - crowd-safety planning studio (API)"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
  "shapely>=2.0",
  "numpy>=1.26",
  "networkx>=3.3",
  "pluggy>=1.5",
  "httpx>=0.27",
  "openai>=1.40",
  "tavily-python>=0.5",
  "PyniteFEA>=0.0.100",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "ezdxf>=1.3",
  "contree-sdk==0.3.6",
  "mapbox-vector-tile==2.1.0",
  "langgraph==1.2.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "types-PyYAML",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
asyncio_mode = "auto"
# keep test temp files on disk (/tmp is RAM-backed here); pytest clears it each run
addopts = "--basetemp=../cache/pytest"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: needs Docker and the sim image",
  "nebius: needs NEBIUS_API_KEY",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "RUF046", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"core/assumptions.py" = ["E501"]  # source citations
"core/settings.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "plugins"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ".."
