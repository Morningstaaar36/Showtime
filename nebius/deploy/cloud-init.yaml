#cloud-config
# A Showtime host (deploy/nebius_vm.sh fills in the user and the SSH key): Docker, make and git.
users:
  - name: __USER__
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - __KEY__
package_update: true
packages: [make, git, jq, ca-certificates, curl]
groups: [docker]
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker __USER__
  - systemctl enable --now docker
